# Production compose for a single-host deployment.
#
# This is what a university actually runs: one machine in a server room, the
# database beside the API, a reverse proxy in front terminating TLS. It is not
# a cluster and does not pretend to be — the failure modes of a cluster nobody
# on site can debug are worse than the failure modes of one host with a tested
# restore.
#
#   cd deploy
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything secret is a file, not an environment variable: a variable is
# visible in `docker inspect`, in /proc/<pid>/environ to anything running as the
# same user, and in a crash dump. Create them before the first start:
#
#   mkdir -p secrets && chmod 700 secrets
#   openssl rand -base64 48 > secrets/jwt_secret
#   openssl rand -base64 32 > secrets/db_password
#   chmod 600 secrets/*
#
# The application reads each through its _FILE variable, which is the same
# convention Kubernetes secrets use, so moving to one later changes nothing
# here.

name: flowed

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowed
      POSTGRES_DB: flowed
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # C collation with UTF-8. Arabic folding is done by the schema's own
      # normalize_arabic rather than by the collation, because no collation
      # folds ta marbuta against ha consistently across versions.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/wal:/srv/wal
    # Not published. The API reaches it over the compose network; nothing else
    # needs to, and a database on the public interface is the single most
    # common way a system like this is lost.
    expose:
      - "5432"
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      # Point-in-time recovery. Without this a failure at 16:00 loses the day's
      # collection; see docs/operations/backup-restore.md.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /srv/wal/%f && cp %p /srv/wal/%f
      - -c
      - archive_timeout=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowed -d flowed"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  migrate:
    image: ghcr.io/swibit/flowed:${FLOWED_VERSION:?set FLOWED_VERSION to the release being deployed}
    entrypoint: ["/app/migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &db_env
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: flowed
      DB_NAME: flowed
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSLMODE: disable
    secrets:
      - db_password
    # Migrations run as their own step and the API waits for it. The API also
    # refuses to serve on a schema mismatch, so a partial deploy stops rather
    # than serving queries against a schema it does not understand.
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    image: ghcr.io/swibit/flowed:${FLOWED_VERSION:?set FLOWED_VERSION to the release being deployed}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db_env
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      # Behind a reverse proxy: name it, or the client IP in the audit trail
      # and the rate limiter's key are both the proxy's.
      HTTP_TRUSTED_PROXIES: "172.16.0.0/12"
      AUTH_JWT_SECRET_FILE: /run/secrets/jwt_secret
      AUTH_REQUIRE_HSTS: "true"
      AUTH_STRICT_SESSION_CHECK: "true"
      LOG_FORMAT: json
      LOG_LEVEL: info
      OBS_METRICS_ENABLED: "true"
      # Loopback inside the container's namespace. Scraping from another host
      # means publishing this deliberately.
      OBS_METRICS_ADDR: "127.0.0.1:9464"
      RECEIPT_UNIVERSITY_NAME: ${RECEIPT_UNIVERSITY_NAME:-الجامعة}
      # The audit trail's off-host copy. The mount must be a directory on
      # another machine that this container may create files in and may not
      # rewrite; a directory on this disk is worse than none, because it looks
      # like a control.
      AUDIT_ARCHIVE_DIR: /srv/audit-archive
    secrets:
      - db_password
      - jwt_secret
    volumes:
      - ./audit-archive:/srv/audit-archive
    ports:
      # Loopback only: TLS is terminated by the reverse proxy on this host.
      # Binding 0.0.0.0 here would publish the API unencrypted alongside it.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
        reservations: { cpus: "0.5", memory: 256M }
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Long enough for the drain: SIGTERM stops accepting, finishes what is in
    # flight, and waits for a scheduled job holding an advisory lock. A process
    # killed mid-job leaves that lock until PostgreSQL notices the connection
    # is gone, and the next replica skips the job until then.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  backup:
    image: ghcr.io/swibit/flowed:${FLOWED_VERSION:?set FLOWED_VERSION}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      # A backup at 01:30 and a restore drill on Sunday at 03:30. The drill is
      # not optional: a backup nobody has restored is a hypothesis.
      - |
        while true; do
          now=$$(date -u +%H%M)
          if [ "$$now" = "0130" ]; then /app/scripts/backup.sh; fi
          if [ "$$now" = "0330" ] && [ "$$(date -u +%u)" = "7" ]; then
            /app/scripts/restore-drill.sh || echo "RESTORE DRILL FAILED"
          fi
          sleep 60
        done
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db_env
      BACKUP_DIR: /srv/backups
      RETENTION_DAYS: "30"
    secrets:
      - db_password
    volumes:
      - ./backups:/srv/backups
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  postgres-data:
