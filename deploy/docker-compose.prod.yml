# Production compose for a single-host deployment.
#
# This is what a university actually runs: one machine in a server room, the
# database beside the API, a reverse proxy in front terminating TLS. It is not
# a cluster and does not pretend to be — the failure modes of a cluster nobody
# on site can debug are worse than the failure modes of one host with a tested
# restore.
#
#   cd deploy
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything secret is a file, not an environment variable: a variable is
# visible in `docker inspect`, in /proc/<pid>/environ to anything running as the
# same user, and in a crash dump. Create them before the first start:
#
#   mkdir -p secrets && chmod 700 secrets
#   openssl rand -base64 48 > secrets/jwt_secret
#   openssl rand -base64 32 > secrets/db_password
#   chmod 600 secrets/*
#
# The application reads each through its _FILE variable, which is the same
# convention Kubernetes secrets use, so moving to one later changes nothing
# here.

name: flowed

# Settings every process needs, including the migrator.
#
# Configuration is loaded and validated whole by each binary, so `migrate` is
# held to the same production rules as the API even though it never serves a
# request: it wants a real signing secret and an explicit origin list, and says
# so by refusing to run. That is why the JWT secret appears below on a process
# that signs nothing.
x-db-env: &db_env
  APP_ENV: production
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: flowed
  DB_NAME: flowed
  DB_PASSWORD_FILE: /run/secrets/db_password
  # The database refuses plaintext in production, and pg-tls below is what
  # makes `require` possible on this host.
  DB_SSLMODE: require
  AUTH_JWT_SECRET_FILE: /run/secrets/jwt_secret
  # The address the university reaches this system at, e.g.
  # https://fees.university.edu.iq. Production refuses the "*" default: an
  # origin list that admits everyone admits every other page the browser has
  # open. The interface is served from this same origin, so in the ordinary
  # deployment this is the one entry there is.
  HTTP_CORS_ORIGINS: ${FLOWED_PUBLIC_ORIGIN:?set FLOWED_PUBLIC_ORIGIN to the site URL, e.g. https://fees.university.edu.iq}

services:
  # The database's TLS material, generated once into its own volume.
  #
  # The application refuses to start in production with DB_SSLMODE=disable, and
  # it is right to: "the database is on the same host" is a property of today's
  # deployment, not of the connection string, and the day the database moves to
  # another machine nobody re-reads this file. PostgreSQL will not use a key it
  # considers world-readable or foreign, so the key is written 0600 and chowned
  # to the uid the postgres image runs as (70) — which is why this is a
  # privileged one-shot step rather than a file committed beside the compose.
  #
  # Self-signed, and the API connects with sslmode=require: encrypted, not
  # authenticated. On one host with the database unpublished that is the honest
  # trade. Move the database to another machine and this becomes a real
  # certificate with DB_SSLMODE=verify-full.
  pg-tls:
    image: alpine:3.23
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /tls/server.key ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -new -x509 -days 3650 -nodes -text \
            -out /tls/server.crt -keyout /tls/server.key -subj "/CN=postgres"
          echo "generated a new server certificate"
        fi
        chown 70:70 /tls/server.crt /tls/server.key
        chmod 600 /tls/server.key
        chmod 644 /tls/server.crt
        echo "postgres tls material ready"
    volumes:
      - pg-tls:/tls

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      pg-tls:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: flowed
      POSTGRES_DB: flowed
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # C collation with UTF-8. Arabic folding is done by the schema's own
      # normalize_arabic rather than by the collation, because no collation
      # folds ta marbuta against ha consistently across versions.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    secrets:
      - db_password
    volumes:
      # Mounted at /var/lib/postgresql, not at .../data: the 18+ images keep the
      # cluster in a major-version subdirectory so `pg_upgrade --link` does not
      # have to cross a mount boundary. Mounting the old path makes the image
      # refuse to start and say so at length.
      - postgres-data:/var/lib/postgresql
      - ./postgres/wal:/srv/wal
      - pg-tls:/etc/pg-tls:ro
    # Not published. The API reaches it over the compose network; nothing else
    # needs to, and a database on the public interface is the single most
    # common way a system like this is lost.
    expose:
      - "5432"
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      # Point-in-time recovery. Without this a failure at 16:00 loses the day's
      # collection; see docs/operations/backup-restore.md.
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /srv/wal/%f && cp %p /srv/wal/%f
      - -c
      - archive_timeout=300
      # TLS, from the material pg-tls prepared.
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/pg-tls/server.crt
      - -c
      - ssl_key_file=/etc/pg-tls/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowed -d flowed"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  migrate:
    image: ${FLOWED_IMAGE:-ghcr.io/swibit/flowed}:${FLOWED_VERSION:?set FLOWED_VERSION to the release being deployed}
    entrypoint: ["/app/migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db_env
    secrets:
      - db_password
      - jwt_secret
    # Migrations run as their own step and the API waits for it. The API also
    # refuses to serve on a schema mismatch, so a partial deploy stops rather
    # than serving queries against a schema it does not understand.
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    image: ${FLOWED_IMAGE:-ghcr.io/swibit/flowed}:${FLOWED_VERSION:?set FLOWED_VERSION to the release being deployed}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db_env
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      # Behind a reverse proxy: name it, or the client IP in the audit trail
      # and the rate limiter's key are both the proxy's.
      HTTP_TRUSTED_PROXIES: "172.16.0.0/12"
      AUTH_REQUIRE_HSTS: "true"
      AUTH_STRICT_SESSION_CHECK: "true"
      LOG_FORMAT: json
      LOG_LEVEL: info
      OBS_METRICS_ENABLED: "true"
      # Loopback inside the container's namespace. Scraping from another host
      # means publishing this deliberately.
      OBS_METRICS_ADDR: "127.0.0.1:9464"
      RECEIPT_UNIVERSITY_NAME: ${RECEIPT_UNIVERSITY_NAME:-الجامعة}
      # The audit trail's off-host copy. The mount must be a directory on
      # another machine that this container may create files in and may not
      # rewrite; a directory on this disk is worse than none, because it looks
      # like a control.
      AUDIT_ARCHIVE_DIR: /srv/audit-archive
    secrets:
      - db_password
      - jwt_secret
    volumes:
      - ./audit-archive:/srv/audit-archive
    ports:
      # Loopback only: TLS is terminated by the reverse proxy on this host.
      # Binding 0.0.0.0 here would publish the API unencrypted alongside it.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
        reservations: { cpus: "0.5", memory: 256M }
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Long enough for the drain: SIGTERM stops accepting, finishes what is in
    # flight, and waits for a scheduled job holding an advisory lock. A process
    # killed mid-job leaves that lock until PostgreSQL notices the connection
    # is gone, and the next replica skips the job until then.
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  backup:
    image: ${FLOWED_IMAGE:-ghcr.io/swibit/flowed}:${FLOWED_VERSION:?set FLOWED_VERSION}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      # A backup at 01:30 and a restore drill on Sunday at 03:30. The drill is
      # not optional: a backup nobody has restored is a hypothesis.
      - |
        while true; do
          now=$$(date -u +%H%M)
          if [ "$$now" = "0130" ]; then /app/scripts/backup.sh; fi
          if [ "$$now" = "0330" ] && [ "$$(date -u +%u)" = "7" ]; then
            /app/scripts/restore-drill.sh || echo "RESTORE DRILL FAILED"
          fi
          sleep 60
        done
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db_env
      BACKUP_DIR: /srv/backups
      RETENTION_DAYS: "30"
    secrets:
      - db_password
      # The drill runs `migrate status` to learn which schema this build
      # expects, and configuration is validated whole — so this process needs a
      # real signing secret to ask a question about migrations.
      - jwt_secret
    volumes:
      - ./backups:/srv/backups
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  postgres-data:
  pg-tls:
