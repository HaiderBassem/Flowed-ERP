# TLS termination in front of Flowed.
#
# The API binds loopback and speaks plain HTTP; this is what makes it reachable.
# Two things here are load bearing rather than boilerplate:
#
#   * X-Forwarded-For, paired with HTTP_TRUSTED_PROXIES in the application.
#     Without the pair, every audit entry records the proxy's address as the
#     client and the rate limiter buckets the whole university into one key.
#   * The long timeout on report and export paths. A debt report over a hundred
#     thousand accounts takes longer than a default proxy timeout, and a proxy
#     that gives up mid-response leaves the operator with half a spreadsheet
#     and no error.

upstream flowed_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Plain HTTP exists only to send people to TLS. A finance system reachable
# unencrypted is one where a password crosses a campus network in the clear.
server {
    listen 80;
    listen [::]:80;
    server_name fees.university.edu.iq;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fees.university.edu.iq;

    ssl_certificate     /etc/letsencrypt/live/fees.university.edu.iq/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fees.university.edu.iq/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The application sets HSTS itself when AUTH_REQUIRE_HSTS is on; setting it
    # here as well is harmless and covers the responses nginx generates on its
    # own, which never reach the application at all.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A receipt PDF and an XLSX export are the largest things this serves; a
    # student photograph import is the largest thing it accepts.
    client_max_body_size 25m;

    access_log /var/log/nginx/flowed.access.log;
    error_log  /var/log/nginx/flowed.error.log warn;

    location / {
        proxy_pass http://flowed_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Reports and exports get their own timeout. Measured: a debt report over
    # 20,000 accounts is ~320 ms and it grows with the year's size, so the
    # ceiling is generous rather than tight — the failure this prevents is a
    # truncated export that looks complete.
    location ~ ^/api/v1/(reports|exports)/ {
        proxy_pass http://flowed_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # The health probe, for a load balancer above this one. Not logged: it is
    # every few seconds forever and it drowns the log it would be read from.
    location = /health {
        proxy_pass http://flowed_api;
        access_log off;
    }

    # /metrics is never proxied. It binds loopback in the application and its
    # bind address is its only access control; the scrape surface enumerates
    # every route and its error rate, which is a map of the system that does
    # not belong on the public interface.
    location = /metrics {
        return 404;
    }
}
