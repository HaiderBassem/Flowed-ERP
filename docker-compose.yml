services:
  postgres:
    image: postgres:18-alpine
    container_name: flowed-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowed
      # C collation with UTF-8 encoding. Arabic name folding is done by the
      # schema's own normalize_arabic function rather than by the collation,
      # because no collation folds ta marbuta against ha or alef maqsura
      # against ya consistently across versions. Pinning to C keeps sort order
      # deterministic and index behaviour predictable.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    command:
      - postgres
      # Log anything slower than a second. At this workload's volume a
      # one-second query is a defect worth seeing, not noise.
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowed"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Migrations are their own step, exactly as they are in production.
  #
  # `api serve` validates the schema at boot and refuses to serve on a
  # mismatch, so without this the first `up` against an empty volume stops with
  # "database is missing 24 migration(s)" — which reads like a broken image and
  # is really a missing step. The API waits for this to complete successfully.
  migrate:
    image: flowed:latest
    build:
      context: .
      dockerfile: Dockerfile
      # The same stamp `make docker-build` passes. Compose cannot run git, so the
      # values arrive from the environment and `make docker-up` is what fills
      # them in; a bare `docker compose build` still works and reports
      # "unknown", which is honest rather than wrong.
      args:
        VERSION: ${VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        TREE_STATE: ${TREE_STATE:-unknown}
    container_name: flowed-migrate
    entrypoint: ["/app/migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: flowed
      DB_SSLMODE: disable
      AUTH_JWT_SECRET: development-secret-change-me-in-production
      LOG_FORMAT: json
    profiles:
      - full

  api:
    # The tag `make docker-build` produces. Named as well as built, so a later
    # `up` reuses the image that was already built and tested rather than
    # quietly rebuilding a different one from whatever the tree now holds.
    image: flowed:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        TREE_STATE: ${TREE_STATE:-unknown}
    container_name: flowed-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: flowed
      DB_SSLMODE: disable
      AUTH_JWT_SECRET: development-secret-change-me-in-production
      LOG_FORMAT: json
    # The published port is a variable because a development machine usually
    # already has something on 8080. The container still listens on 8080
    # internally — only the host side moves — so nothing inside the image or
    # its configuration depends on which port was chosen outside it.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    profiles:
      # Not started by `docker compose up -d postgres`; bring it up explicitly
      # with `docker compose --profile full up`. Day-to-day development runs
      # the API on the host against the containerised database.
      - full

volumes:
  postgres-data:
